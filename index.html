<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>YEAR LEVEL 2 MEDICINE</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YL2 Planner">

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak]{display:none!important}
    * { scrollbar-width: thin; scrollbar-color: #065f46 #000000; }
    *::-webkit-scrollbar { width: 5px; height: 5px; }
    *::-webkit-scrollbar-thumb { background: #065f46; border-radius: 999px; }
    *::-webkit-scrollbar-track { background: #000000; }

    /* Custom Neon Z Logo Style */
    .neon-logo {
        background-color: #000000;
        border: 1px solid rgba(16, 185, 129, 0.4);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #10b981;
        text-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
    }
  </style>
</head>

<body class="bg-black text-emerald-400 min-h-full flex flex-col font-sans" x-data="medPlanner()">

  <header class="bg-zinc-950 border-b border-emerald-900/50 p-4 flex items-center justify-between sticky top-0 z-50 shadow-lg">
      <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-lg neon-logo text-lg font-mono">
              Z
          </div>
          <div>
              <h1 class="text-base md:text-xl font-bold tracking-wider text-emerald-400">MD-2 CLINICAL & BASIC SCIENCES</h1>
              <p class="text-[10px] text-emerald-600/80">Year Level 2 Master Dashboard</p>
          </div>
      </div>
      <div class="text-xs font-mono text-emerald-400 bg-emerald-950/40 px-3 py-1 rounded border border-emerald-900/50">
          <span x-text="currentDateStr"></span>
      </div>
  </header>

  <main class="flex-1 p-4 max-w-7xl mx-auto w-full flex flex-col gap-4">
      
      <div class="flex items-center justify-between bg-zinc-900/60 border border-emerald-900/30 p-3 rounded-xl">
          <div class="flex items-center space-x-2">
              <button @click="changeMonth(-1)" class="px-3 py-1 bg-emerald-950 hover:bg-emerald-900 border border-emerald-800 rounded text-xs text-emerald-300 transition">&larr; Prev</button>
              <h2 class="text-sm md:text-base font-semibold text-emerald-300 px-2" x-text="calendarMonthName"></h2>
              <button @click="changeMonth(1)" class="px-3 py-1 bg-emerald-950 hover:bg-emerald-900 border border-emerald-800 rounded text-xs text-emerald-300 transition">Next &rarr;</button>
          </div>
          <button @click="openNewTaskModal()" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs transition shadow-lg shadow-emerald-900/20">
              + Add Event/Task
          </button>
      </div>

      <div class="grid grid-cols-7 gap-1 bg-zinc-950 border border-emerald-900/40 rounded-xl p-2 flex-1">
          <template x-for="dayName in ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
              <div class="text-center text-[11px] font-bold text-emerald-600 py-1" x-text="dayName"></div>
          </template>

          <template x-for="day in calendarDays">
              <div class="min-h-[85px] bg-zinc-900/40 border border-emerald-950 rounded p-1.5 flex flex-col justify-between transition hover:border-emerald-800/60"
                   :class="{'opacity-30': !day.isCurrentMonth}">
                  <div class="flex justify-between items-center text-xs">
                      <span class="font-mono text-emerald-500" x-text="day.dayNum"></span>
                  </div>
                  <div class="flex-1 overflow-y-auto space-y-1 my-1">
                      <template x-for="event in day.events">
                          <div class="text-[10px] bg-emerald-950/80 border border-emerald-800/40 text-emerald-300 rounded px-1.5 py-0.5 truncate" x-text="event.title"></div>
                      </template>
                  </div>
              </div>
          </template>
      </div>
  </main>

  <footer class="text-center py-3 text-[10px] text-emerald-600/60 border-t border-zinc-900">
      MD-2 Digital Workspace &bull; Secure Local & Cloud Syncing Active
  </footer>

  <script>
      function medPlanner() {
          return {
              currentDateStr: new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }),
              viewYear: new Date().getFullYear(),
              viewMonth: new Date().getMonth(),
              calendarMonthName: '',
              calendarDays: [],
              calendarTasks: JSON.parse(localStorage.getItem('med_calendar_tasks')) || {},

              init() {
                  this.buildCalendar();
              },

              buildCalendar() {
                  const firstDayIndex = new Date(this.viewYear, this.viewMonth, 1).getDay();
                  const totalDays = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
                  this.calendarMonthName = new Date(this.viewYear, this.viewMonth).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
                  
                  let days = [];
                  const prevTotalDays = new Date(this.viewYear, this.viewMonth, 0).getDate();
                  
                  for (let i = firstDayIndex - 1; i >= 0; i--) {
                      days.push({ dayNum: prevTotalDays - i, isCurrentMonth: false, dateStr: '', events: [] });
                  }

                  for (let i = 1; i <= totalDays; i++) {
                      const mStr = String(this.viewMonth + 1).padStart(2, '0');
                      const dStr = String(i).padStart(2, '0');
                      const dateString = `${this.viewYear}-${mStr}-${dStr}`;
                      let evs = this.calendarTasks[dateString] || [];
                      days.push({ dayNum: i, isCurrentMonth: true, dateStr: dateString, events: evs });
                  }

                  const remaining = 42 - days.length;
                  for (let i = 1; i <= remaining; i++) {
                      days.push({ dayNum: i, isCurrentMonth: false, dateStr: '', events: [] });
                  }

                  this.calendarDays = days;
              },

              changeMonth(dir) {
                  this.viewMonth += dir;
                  if (this.viewMonth > 11) {
                      this.viewMonth = 0;
                      this.viewYear++;
                  } else if (this.viewMonth < 0) {
                      this.viewMonth = 11;
                      this.viewYear--;
                  }
                  this.buildCalendar();
              },

              openNewTaskModal() {
                  const title = prompt("Enter task/exam description:");
                  if (!title) return;
                  const dateStr = prompt("Enter date (Format: YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
                  if (!dateStr) return;

                  if (!this.calendarTasks[dateStr]) {
                      this.calendarTasks[dateStr] = [];
                  }
                  this.calendarTasks[dateStr].push({ title });
                  localStorage.setItem('med_calendar_tasks', JSON.stringify(this.calendarTasks));
                  this.buildCalendar();
              }
          }
      }
  </script>
</body>
</html>
