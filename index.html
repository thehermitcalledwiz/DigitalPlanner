<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YEAR LEVEL 2 MEDICINE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak]{display:none!important}
    * { scrollbar-width: thin; scrollbar-color: #065f46 #000000; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-thumb { background: #065f46; border-radius: 999px; }
    *::-webkit-scrollbar-track { background: #000000; }
  </style>
</head>

<body class="bg-black text-emerald-400 min-h-screen p-2 md:p-4 font-mono selection:bg-emerald-900 selection:text-white" x-data="smartPlannerApp()">
  <div class="max-w-[1400px] mx-auto bg-black rounded-3xl shadow-2xl shadow-emerald-950/50 border border-emerald-900/60 overflow-hidden flex flex-col md:flex-row h-[95vh]">

    <!-- ================= SIDEBAR ================= -->
    <aside class="w-full md:w-64 bg-black border-r border-emerald-900/60 flex flex-col justify-between p-4 shrink-0">
      <div class="space-y-6">
        <div class="space-y-3 px-2">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-950 border border-emerald-500/50 text-emerald-400 flex items-center justify-center font-bold text-lg shadow-lg shadow-emerald-900/30">M</div>
            <div>
              <h1 class="font-extrabold text-emerald-300 tracking-wider text-sm leading-tight">YEAR LEVEL 2 MEDICINE</h1>
              <p class="text-[11px] text-emerald-500 font-medium" x-text="timeGreeting"></p>
            </div>
          </div>
          <div class="p-2.5 rounded-xl bg-emerald-950/30 border border-emerald-900/50 text-[11px] text-emerald-400/90 italic text-center">
            "Chop wood, carry water"
          </div>
        </div>

        <nav class="space-y-1">
          <template x-for="item in navItems" :key="item.id">
            <button @click="currentNav = item.id"
                    :class="currentNav === item.id ? 'bg-emerald-900/60 text-emerald-200 border border-emerald-500/50 shadow-lg shadow-emerald-950 font-semibold' : 'text-emerald-500 hover:bg-emerald-950/40 hover:text-emerald-300 font-medium border border-transparent'"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-all text-left">
              <span class="text-base" x-text="item.icon"></span>
              <span x-text="item.label"></span>
            </button>
          </template>
        </nav>
      </div>

      <div class="bg-emerald-950/40 border border-emerald-900/60 rounded-2xl p-3 text-xs text-emerald-300 space-y-1">
        <div class="font-bold flex items-center justify-between">
          <span>Cloud Sync Active</span>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </div>
        <p class="text-[11px] text-emerald-500" x-text="syncStatusText">Initializing...</p>
      </div>
    </aside>

    <!-- ================= MAIN CONTENT AREA ================= -->
    <main class="flex-1 flex flex-col overflow-hidden bg-black">
      <header class="h-16 border-b border-emerald-900/60 px-6 flex items-center justify-between shrink-0 bg-black">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-extrabold text-emerald-300 tracking-tight" x-text="dateHeaderString"></h2>
          <div class="text-xs font-semibold text-emerald-400 bg-emerald-950/60 px-3 py-1 rounded-full border border-emerald-900" x-text="currentTimeString"></div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-6 space-y-6" x-show="currentNav === 'journal'">
        <div class="bg-emerald-950/40 border border-emerald-900/80 rounded-2xl p-4 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-emerald-300 text-lg">Medical Study Journal & Quick Notes</h3>
            <p class="text-xs text-emerald-500 mt-0.5">Jot down clinical correlations, high-yield reminders, or personal reflections.</p>
          </div>
          <button @click="createNewJournalEntry()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold rounded-xl text-xs shadow-sm">+ New Note</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="space-y-2 md:col-span-1 max-h-[60vh] overflow-y-auto pr-2">
            <template x-for="note in journalNotes" :key="note.id">
              <div @click="activeJournalId = note.id"
                   :class="activeJournalId === note.id ? 'bg-emerald-950 border-emerald-500' : 'bg-black border-emerald-900/60 hover:bg-emerald-950/30'"
                   class="border rounded-xl p-3.5 cursor-pointer transition-all space-y-1">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-xs text-emerald-200 truncate" x-text="note.title || 'Untitled Note'"></span>
                </div>
                <p class="text-[11px] text-emerald-500 truncate" x-text="note.content || 'Empty note...'"></p>
                <div class="text-[9px] text-emerald-600 pt-1" x-text="note.date"></div>
              </div>
            </template>
          </div>

          <div class="md:col-span-2 bg-black border border-emerald-900/80 rounded-2xl p-4 flex flex-col h-[60vh]">
            <template x-if="getActiveJournal()">
              <div class="flex flex-col h-full space-y-4">
                <input type="text" x-model="getActiveJournal().title" @input="saveJournalNotes()" placeholder="Note Title..."
                       class="w-full bg-black border border-emerald-900 rounded-xl px-4 py-2.5 text-sm font-bold text-emerald-200 focus:outline-none focus:border-emerald-500">
                <textarea x-model="getActiveJournal().content" @input="saveJournalNotes()" placeholder="Write your notes here..."
                          class="w-full flex-1 bg-black border border-emerald-900 rounded-xl p-4 text-xs text-emerald-300 focus:outline-none focus:border-emerald-500 resize-none font-mono"></textarea>
                <div class="flex items-center justify-between text-[11px] text-emerald-600 pt-2 border-t border-emerald-950">
                  <span x-text="'Last updated: ' + getActiveJournal().date"></span>
                  <span class="text-emerald-500 font-semibold" x-text="syncStatusText"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcFt0qsHouaON_U4k1w_mBlDGdslUt3-U",
      authDomain: "my-digital-planner-scheduler.firebaseapp.com",
      projectId: "my-digital-planner-scheduler",
      storageBucket: "my-digital-planner-scheduler.firebasestorage.app",
      messagingSenderId: "238183164684",
      appId: "1:238183164684:web:51ef2928009a2fe1403729",
      measurementId: "G-G4KVQZMKVC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseCloud = { db, doc, setDoc, getDoc };
    console.log("Firebase Module Loaded Successfully!");
  </script>

  <script>
    function smartPlannerApp() {
      const uid = () => Math.random().toString(16).slice(2) + "-" + Date.now().toString(16);
      const defaultJournalNotes = [
        { id: uid(), title: 'Cardiology High-Yield', content: 'Remember pressure-volume loops during heart failure.', date: new Date().toLocaleDateString() }
      ];

      return {
        currentNav: 'journal',
        currentTimeString: '',
        dateHeaderString: '',
        timeGreeting: '',
        syncStatusText: 'Connecting...',
        navItems: [{ id: 'journal', label: 'Journal Notes', icon: '📓' }],
        journalNotes: defaultJournalNotes,
        activeJournalId: null,

        async init() {
          this.updateClock();
          setInterval(() => this.updateClock(), 1000);
          if (this.journalNotes.length > 0) {
            this.activeJournalId = this.journalNotes[0].id;
          }
          await this.loadFromCloud();
        },

        async loadFromCloud() {
          try {
            const fb = window.firebaseCloud;
            if (!fb) { setTimeout(() => this.loadFromCloud(), 500); return; }
            const docSnap = await fb.getDoc(fb.doc(fb.db, "planners", "med_schedule_data"));
            if (docSnap.exists()) {
              const data = docSnap.data();
              this.journalNotes = data.journalNotes || defaultJournalNotes;
              this.syncStatusText = "Synced with Firebase ✨";
            } else {
              this.syncStatusText = "Creating Cloud Record ✨";
              this.saveToCloud();
            }
          } catch (e) {
            console.error("Cloud load error:", e);
            this.syncStatusText = "Sync Failed ⚠️";
          }
          if (this.journalNotes.length > 0 && !this.activeJournalId) {
            this.activeJournalId = this.journalNotes[0].id;
          }
        },

        async saveToCloud() {
          try {
            const fb = window.firebaseCloud;
            if (!fb) return;
            this.syncStatusText = "Syncing...";
            await fb.setDoc(fb.doc(fb.db, "planners", "med_schedule_data"), {
              journalNotes: this.journalNotes,
              lastUpdated: new Date()
            });
            this.syncStatusText = "Synced with Firebase ✨";
          } catch (e) {
            console.error("Cloud save error:", e);
            this.syncStatusText = "Sync Failed ⚠️";
          }
        },

        updateClock() {
          const now = new Date();
          this.currentTimeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          this.dateHeaderString = now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
          const hr = now.getHours();
          this.timeGreeting = hr < 12 ? "Good morning!" : hr < 18 ? "Good afternoon!" : "Good evening!";
        },

        getActiveJournal() {
          return this.journalNotes.find(n => n.id === this.activeJournalId);
        },

        createNewJournalEntry() {
          const newNote = { id: uid(), title: 'New Clinical Note', content: '', date: new Date().toLocaleDateString() };
          this.journalNotes.unshift(newNote);
          this.activeJournalId = newNote.id;
          this.saveToCloud();
        },

        saveJournalNotes() {
          const active = this.getActiveJournal();
          if (active) active.date = new Date().toLocaleDateString();
          this.saveToCloud();
        }
      }
    }
  </script>
</body>
</html>
